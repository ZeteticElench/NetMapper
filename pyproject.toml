[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netmapper"
version = "1.0.0"
description = "Network topology discovery tool using PyATS and Neo4j"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyats>=24.0",
    "genie>=24.0",
    "neo4j>=5.14.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "typing-extensions>=4.8.0",
]

[project.scripts]
netmapper = "netmapper.main:main"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict = true

[tool.black]
line-length = 100
target-version = ['py39']
