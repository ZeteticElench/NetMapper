# NetMapper Configuration Example
# Copy this file to config.yaml and update with your settings

# Starting device for network discovery
start_device:
  hostname: "core-switch-01"
  ip: "192.168.1.1"
  username: "admin"
  password: "cisco123"
  enable_password: "enable123"  # Optional, defaults to password
  protocol: "ssh"  # ssh or telnet
  port: 22
  os: "ios"  # ios, iosxe, nxos, iosxr, etc.

# Neo4j database configuration
neo4j:
  uri: "bolt://localhost:7687"
  username: "neo4j"
  password: "your-neo4j-password"

# Discovery options
discovery:
  # Maximum discovery depth (optional, null means no limit)
  max_depth: null

  # Enable/disable specific discovery methods
  discover_cdp: true
  discover_lldp: true
  discover_stp: true
  discover_vlans: true

  # Timeouts in seconds
  connection_timeout: 30
  command_timeout: 30

# Parallel discovery options (10-50x faster than sequential)
parallel:
  # Enable parallel discovery with worker pool
  enable: true

  # Number of concurrent workers (devices processed simultaneously)
  # Recommended: 10-20 for most networks, 50+ for large networks
  max_workers: 10

  # Maximum work queue size (backpressure control)
  queue_max_size: 100

  # Adaptive worker tuning (auto-scale workers based on queue depth)
  # "Waiting is infinitely parallelizable until you run out of RAM"
  enable_adaptive_tuning: true

  # Minimum workers (always running)
  min_workers: 5

  # Maximum workers (async coroutines use ~5 KB each, so 100 workers = ~500 KB!)
  # RAM is the only limit - set this high!
  adaptive_max_workers: 100

  # Batched Neo4j writes (10-100x faster than individual writes)
  # Batch size scales dynamically with queue depth
  enable_neo4j_batching: true

# Bejerano Layer 2 topology discovery options
bejerano:
  # Enable Bejerano algorithm for physical topology discovery
  enable: true

  # SNMP community string (if using SNMP collection method)
  snmp_community: "public"

  # MAC address table collection method
  # "snmp" - Use SNMP Bridge MIB (RFC 1493) - faster, requires SNMP access
  # "pyats" - Use PyATS CLI parsing - works without SNMP, uses SSH
  mac_collection_method: "snmp"
